name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Scan full history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - run: npm run check
      - run: npm run pack:artifact
      - name: Upload versioned consumer package
        uses: actions/upload-artifact@v7
        with:
          name: bunnyland-ui-web-package
          path: artifacts/*.tgz

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook
      - name: Upload storybook screenshots
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-dist
      - name: Upload storybook zip
        uses: actions/upload-artifact@v7
        with:
          name: storybook-zip
          path: storybook.zip

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/thalismind/bunnyland-ui-web:main
            ghcr.io/thalismind/bunnyland-ui-web:${{ github.sha }}
          provenance: mode=max
          sbom: true

  storybook-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.storybook
          target: serve
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/thalismind/bunnyland-ui-web-storybook:main
            ghcr.io/thalismind/bunnyland-ui-web-storybook:${{ github.sha }}
          load: ${{ github.event_name != 'push' }}
          provenance: mode=max
          sbom: true
      - name: Scan exact Storybook image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/thalismind/bunnyland-ui-web-storybook:${{ github.sha }}
          output-format: table
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          by-cve: true
